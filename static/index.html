<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>电商客服 Agent</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f6f8; display: flex; flex-direction: column; align-items: center; height: 100vh; }
  header { width: 100%; background: #2b6cb0; color: #fff; padding: 14px 20px; text-align: center; font-size: 18px; font-weight: 600; }
  #chat { flex: 1; width: 100%; max-width: 720px; overflow-y: auto; padding: 20px; }
  .msg { margin-bottom: 14px; display: flex; }
  .msg.user { justify-content: flex-end; }
  .bubble { max-width: 80%; padding: 10px 14px; border-radius: 12px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; font-size: 15px; }
  .user .bubble { background: #2b6cb0; color: #fff; border-bottom-right-radius: 4px; }
  .assistant .bubble { background: #fff; color: #222; border: 1px solid #e2e8f0; border-bottom-left-radius: 4px; }
  .bar { width: 100%; max-width: 720px; display: flex; gap: 10px; padding: 14px 20px 20px; }
  #input { flex: 1; padding: 12px 14px; border: 1px solid #cbd5e0; border-radius: 8px; font-size: 15px; outline: none; }
  #input:focus { border-color: #2b6cb0; }
  button { padding: 12px 22px; background: #2b6cb0; color: #fff; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; }
  button:hover { background: #1f5a96; }
</style>
</head>
<body>
  <header>电商客服 RAG Agent</header>
  <div id="chat"></div>
  <div class="bar">
    <input id="input" placeholder="问点什么，比如「衣服不合适能退吗」" onkeydown="if(event.key==='Enter')send()">
    <button onclick="send()">发送</button>
  </div>
  <script>
    let history = [];
    function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function add(who, text){
      const wrap = document.createElement('div');
      wrap.className = 'msg ' + who;
      const b = document.createElement('div');
      b.className = 'bubble';
      b.innerHTML = esc(text);
      wrap.appendChild(b);
      const chat = document.getElementById('chat');
      chat.appendChild(wrap);
      chat.scrollTop = chat.scrollHeight;
    }
    async function send(){
      const input = document.getElementById('input');
      const msg = input.value.trim();
      if(!msg) return;
      add('user', msg);
      input.value = '';
      const resp = await fetch('/api/chat', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({message: msg, history: history})
      });
      const data = await resp.json();
      add('assistant', data.answer);
      history.push({role:'user', content: msg});
      history.push({role:'assistant', content: data.answer});
    }
  </script>
</body>
</html>
